[package]
name = "htek_daemon"
version.workspace = true
edition.workspace = true

[[bin]]
name = "htekd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
aya = "0.13.1"
chrono = "0.4.45"
glob = "0.3.3"
htek_lib = { version = "0.1.0", path = "../htek_lib" }
libc = "0.2.184"
notify-rust = "4.17.0"
rustix = "1.1.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
whoami = "2.1.2"

[build-dependencies]
cc = "1.2.65"
