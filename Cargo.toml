[package]
name = "htek-cli"
version = "0.1.0"
edition = "2024"
build = "./build.rs"

[dependencies]
anyhow = "1.0.102"
aya = "0.13.1"
clap = "4.6.1"
directories = "6.0.0"
glob = "0.3.3"
libc = "0.2.184"
notify-rust = "4.17.0"
rustix = "1.1.4"
serde = { version = "1.0.228", features = ["derive"] }
